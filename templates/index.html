<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Hệ thống Quản lý Đơn hàng AI</h1>
            <span id="api-status" class="status-text">Đang kiểm tra kết nối...</span>
        </header>

        <!-- Form thêm đơn hàng -->
        <section class="card">
            <h2>Thêm đơn hàng mới</h2>
            <form id="order-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="customer_name">Tên khách hàng *</label>
                        <input type="text" id="customer_name" required placeholder="Nguyễn Văn A">
                    </div>
                    <div class="form-group">
                        <label for="priority">Độ ưu tiên (Priority)</label>
                        <select id="priority">
                            <option value="">Tự động dự đoán bằng AI</option>
                            <option value="High">High (Cao)</option>
                            <option value="Medium">Medium (Trung bình)</option>
                            <option value="Low">Low (Thấp)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="status">Trạng thái</label>
                        <select id="status">
                            <option value="Pending">Pending</option>
                            <option value="Processing">Processing</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="product_description">Mô tả sản phẩm & Yêu cầu giao hàng *</label>
                        <button type="button" id="btn-predict" class="btn btn-outline">Dự đoán Priority bằng AI</button>
                    </div>
                    <textarea id="product_description" rows="3" required placeholder="Ví dụ: Giao hỏa tốc 2h laptop Dell XPS 15, khách cần gấp..."></textarea>
                    <p id="predict-result" class="predict-info" style="display: none;"></p>
                </div>

                <button type="submit" id="btn-submit" class="btn btn-primary">Tạo đơn hàng</button>
            </form>
        </section>

        <!-- Danh sách đơn hàng -->
        <section class="card">
            <div class="table-header">
                <h2>Danh sách đơn hàng (<span id="order-count">0</span>)</h2>
                <div class="filters">
                    <input type="text" id="search-input" placeholder="Tìm tên hoặc mô tả...">
                    <select id="filter-priority">
                        <option value="">Tất cả Priority</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                    <select id="filter-status">
                        <option value="">Tất cả trạng thái</option>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Completed">Completed</option>
                        <option value="Cancelled">Cancelled</option>
                    </select>
                    <button type="button" id="btn-refresh" class="btn btn-outline">Tải lại</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Khách hàng</th>
                        <th>Mô tả sản phẩm</th>
                        <th>Priority</th>
                        <th>Trạng thái</th>
                        <th>Ngày tạo</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <tr><td colspan="7" class="text-center">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <!-- Modal xem log email -->
    <div id="log-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="log-modal-title">Email phản hồi tự động</h3>
                <button type="button" class="close-btn" onclick="closeModal('log-modal')">&times;</button>
            </div>
            <div id="log-modal-body" class="modal-body">Đang tải...</div>
            <div class="modal-footer">
                <button type="button" id="btn-resend-email" class="btn btn-outline">Tạo lại email</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal('log-modal')">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Modal sửa đơn hàng -->
    <div id="edit-modal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Sửa đơn hàng #<span id="edit-id-label"></span></h3>
                <button type="button" class="close-btn" onclick="closeModal('edit-modal')">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Tên khách hàng</label>
                        <input type="text" id="edit-name" required>
                    </div>
                    <div class="form-group">
                        <label>Mô tả sản phẩm</label>
                        <textarea id="edit-desc" rows="3" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="edit-priority">
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Trạng thái</label>
                            <select id="edit-status">
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('edit-modal')">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
